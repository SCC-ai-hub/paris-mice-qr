<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>QR Text 1.2</title>
  <link rel="stylesheet" href="../../css/qr-text.css?v=11">
</head>
<body>
  <div class="stage">
    <div class="panel">
      <header class="top-chrome">
        <div class="lang-band">
          <div class="lang-bar" data-bar-flags></div>
        </div>
        <div class="font-controls" data-font-controls>
          <button type="button" class="font-btn" data-font-minus aria-label="Decrease text size">−</button>
          <div class="font-controls__hint">
            <span class="font-controls__aa" aria-hidden="true"><span class="font-controls__a-sm">A</span><span class="font-controls__a-lg">A</span></span>
            <span class="font-controls__label" data-font-hint>Text size</span>
          </div>
          <button type="button" class="font-btn" data-font-plus aria-label="Increase text size">+</button>
        </div>
      </header>

      <main class="content-wrap">
        <div class="text-code" data-text-code></div>
        <div class="text-section">
          <div class="text-body" data-text-body></div>
        </div>
        <div class="scroll-track" aria-hidden="true"><div class="scroll-thumb"></div></div>
      </main>

      <footer class="footer">
        <div class="scroll-arrows" aria-label="Scroll text">
          <button type="button" class="scroll-btn" data-scroll-up aria-label="Scroll up">
            <svg viewBox="0 0 24 14" aria-hidden="true"><path d="M2 12L12 2l10 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="scroll-btn" data-scroll-down aria-label="Scroll down">
            <svg viewBox="0 0 24 14" aria-hidden="true"><path d="M2 2l10 10L22 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </footer>

      <div class="lang-overlay" data-lang-overlay>
        <div class="lang-overlay__tray">
          <div class="lang-overlay__title">Language / Язык</div>
          <div class="lang-overlay__flags" data-overlay-flags></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/qr-text.js?v=11"></script>
  <script>
    QRTextApp.load("1.2").catch(function (err) {
      document.querySelector("[data-text-body]").textContent = "Error loading text.";
      console.error(err);
    });
  </script>
</body>
</html>
